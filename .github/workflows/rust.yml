name: Rust Release

on:
  push:
    # Trigger khi bạn push một tag mới (ví dụ: git tag v1.0.0 && git push origin v1.0.0)
    tags:
      - 'v*'
  # Hoặc bạn có thể giữ trigger push lên nhánh main để tạo artifact cho mỗi commit
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-release:
    name: Build and Create Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache cargo registry
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build Release version
        run: cargo build --release --verbose

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KSK_webapp-ubuntu
          # Thay đổi 'KSK_webapp' thành tên chính xác của file binary được cấu hình trong Cargo.toml nếu cần
          path: target/release/KSK_webapp

      - name: Create GitHub Release
        # Chỉ tạo Release trên GitHub nếu được trigger bằng Tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: target/release/KSK_webapp
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
