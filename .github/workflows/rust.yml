name: Rust Release

on:
  push:
    tags:
      - 'v*'
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-release:
    name: Build and Create Release
    runs-on: windows-latest # Chuyển sang Windows để build ra file .exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache cargo registry
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build Release version
        run: cargo build --release --verbose

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KSK_webapp-windows
          # Sửa lại tên file viết thường và thêm đuôi .exe
          path: target/release/ksk_webapp.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          # Cập nhật đường dẫn file để tạo Release
          files: target/release/ksk_webapp.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
