      </main>
    </div>

    <!-- ===================================================================== -->
    <!-- THANH ĐIỀU HƯỚNG ĐÁY MOBILE (BOTTOM BAR 56PX - DESIGN.MD 3.4 & 18:9) -->
    <!-- ===================================================================== -->
    <nav class="md:hidden h-14 bg-white border-t border-[#E2E8F0] fixed bottom-0 left-0 right-0 z-40 flex items-center justify-around px-2 shadow-lg no-print">
      <button type="button" @click="activeTab = 'reception'" class="flex flex-col items-center gap-0.5 py-1 px-2 rounded-lg transition-colors" :class="activeTab === 'reception' ? 'text-[#3498DB]' : 'text-[#7F8C8D]'">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
        <span class="text-[10px] font-medium">Tiếp nhận</span>
      </button>

      <button type="button" @click="activeTab = 'history'" class="flex flex-col items-center gap-0.5 py-1 px-2 rounded-lg transition-colors" :class="activeTab === 'history' ? 'text-[#3498DB]' : 'text-[#7F8C8D]'">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        <span class="text-[10px] font-medium">Tiền sử</span>
      </button>

      <button type="button" @click="sidebarOpen = !sidebarOpen" class="flex flex-col items-center gap-0.5 py-1 px-2 rounded-lg transition-colors text-[#2C3E50]">
        <div class="relative">
          <svg class="w-5 h-5 text-[#3498DB]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"/></svg>
          <span class="absolute -top-1 -right-2 px-1 text-[9px] font-bold rounded-full bg-[#2ECC71] text-white" x-text="recordsList.length"></span>
        </div>
        <span class="text-[10px] font-medium">DS Khám</span>
      </button>

      <button type="button" @click="activeTab = 'clinical'" class="flex flex-col items-center gap-0.5 py-1 px-2 rounded-lg transition-colors" :class="activeTab === 'clinical' ? 'text-[#3498DB]' : 'text-[#7F8C8D]'">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/></svg>
        <span class="text-[10px] font-medium">Khám LS</span>
      </button>

      <button type="button" @click="activeTab = 'conclusion'" class="flex flex-col items-center gap-0.5 py-1 px-2 rounded-lg transition-colors" :class="activeTab === 'conclusion' ? 'text-[#3498DB]' : 'text-[#7F8C8D]'">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        <span class="text-[10px] font-medium">Kết luận</span>
      </button>
    </nav>
  </div>

  <!-- ===================================================================== -->
  <!-- MODAL THÊM / SỬA TÀI KHOẢN (MULTI-ROLE)                              -->
  <!-- ===================================================================== -->
  <div x-show="showUserModal" x-cloak class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/40 backdrop-blur-xs no-print">
    <div class="bg-white rounded-2xl shadow-2xl border border-slate-200 w-full max-w-lg p-6 space-y-4 max-h-[90vh] overflow-y-auto">
      <div class="flex items-center justify-between border-b border-slate-100 pb-3">
        <h3 class="font-bold text-slate-900 text-sm" x-text="userModalMode === 'create' ? 'Thêm tài khoản mới' : 'Chỉnh sửa tài khoản'"></h3>
        <button type="button" @click="showUserModal = false" class="text-slate-400 hover:text-slate-600">✕</button>
      </div>

      <div class="space-y-3 text-xs">
        <div>
          <label class="label-title">Tên đăng nhập:</label>
          <input type="text" x-model="userModalForm.username" :disabled="userModalMode === 'edit'" class="input-box" placeholder="nvtiensu..." />
        </div>

        <div>
          <label class="label-title">Họ và tên hiển thị:</label>
          <input type="text" x-model="userModalForm.full_name" class="input-box" placeholder="ĐD. Lê Thị Tiền Sử..." />
        </div>

        <div>
          <label class="label-title" x-text="userModalMode === 'create' ? 'Mật khẩu:' : 'Mật khẩu mới (bỏ trống nếu không đổi):'"></label>
          <input type="password" x-model="userModalForm.password" class="input-box" placeholder="••••••" />
        </div>

        <!-- Checkbox phân quyền độc lập nhiều vai trò -->
        <div class="space-y-1.5 pt-1">
          <label class="label-title font-semibold text-slate-800">Chọn vai trò phân quyền (Multi-role):</label>
          <div class="grid grid-cols-2 gap-2 p-3 bg-slate-50 rounded-xl border border-slate-200">
            <label class="flex items-center gap-2 cursor-pointer">
              <input type="checkbox" value="reception" x-model="userModalForm.roles" class="rounded text-sky-600 focus:ring-sky-500">
              <span class="font-medium text-slate-800">reception</span>
              <span class="text-[10.5px] text-slate-500">(Lễ tân)</span>
            </label>

            <label class="flex items-center gap-2 cursor-pointer">
              <input type="checkbox" value="tiensu" x-model="userModalForm.roles" class="rounded text-emerald-600 focus:ring-emerald-500">
              <span class="font-medium text-emerald-800">tiensu</span>
              <span class="text-[10.5px] text-slate-500">(Tiền sử)</span>
            </label>

            <label class="flex items-center gap-2 cursor-pointer">
              <input type="checkbox" value="bs_theluc" x-model="userModalForm.roles" class="rounded text-indigo-600 focus:ring-indigo-500">
              <span class="font-medium text-slate-800">bs_theluc</span>
              <span class="text-[10.5px] text-slate-500">(Thể lực)</span>
            </label>

            <label class="flex items-center gap-2 cursor-pointer">
              <input type="checkbox" value="bs_noi" x-model="userModalForm.roles" class="rounded text-blue-600 focus:ring-blue-500">
              <span class="font-medium text-slate-800">bs_noi</span>
              <span class="text-[10.5px] text-slate-500">(Nội)</span>
            </label>

            <label class="flex items-center gap-2 cursor-pointer">
              <input type="checkbox" value="bs_ngoai" x-model="userModalForm.roles" class="rounded text-orange-600 focus:ring-orange-500">
              <span class="font-medium text-slate-800">bs_ngoai</span>
              <span class="text-[10.5px] text-slate-500">(Ngoại)</span>
            </label>

            <label class="flex items-center gap-2 cursor-pointer">
              <input type="checkbox" value="bs_dalieu" x-model="userModalForm.roles" class="rounded text-teal-600 focus:ring-teal-500">
              <span class="font-medium text-slate-800">bs_dalieu</span>
              <span class="text-[10.5px] text-slate-500">(Da liễu)</span>
            </label>

            <label class="flex items-center gap-2 cursor-pointer">
              <input type="checkbox" value="bs_san" x-model="userModalForm.roles" class="rounded text-pink-600 focus:ring-pink-500">
              <span class="font-medium text-slate-800">bs_san</span>
              <span class="text-[10.5px] text-slate-500">(Sản)</span>
            </label>

            <label class="flex items-center gap-2 cursor-pointer">
              <input type="checkbox" value="bs_mat" x-model="userModalForm.roles" class="rounded text-cyan-600 focus:ring-cyan-500">
              <span class="font-medium text-slate-800">bs_mat</span>
              <span class="text-[10.5px] text-slate-500">(Mắt)</span>
            </label>

            <label class="flex items-center gap-2 cursor-pointer">
              <input type="checkbox" value="bs_tmh" x-model="userModalForm.roles" class="rounded text-violet-600 focus:ring-violet-500">
              <span class="font-medium text-slate-800">bs_tmh</span>
              <span class="text-[10.5px] text-slate-500">(TMH)</span>
            </label>

            <label class="flex items-center gap-2 cursor-pointer">
              <input type="checkbox" value="bs_rhm" x-model="userModalForm.roles" class="rounded text-rose-600 focus:ring-rose-500">
              <span class="font-medium text-slate-800">bs_rhm</span>
              <span class="text-[10.5px] text-slate-500">(RHM)</span>
            </label>

            <label class="flex items-center gap-2 cursor-pointer">
              <input type="checkbox" value="bs_cls" x-model="userModalForm.roles" class="rounded text-purple-600 focus:ring-purple-500">
              <span class="font-medium text-slate-800">bs_cls</span>
              <span class="text-[10.5px] text-slate-500">(CLS)</span>
            </label>

            <label class="flex items-center gap-2 cursor-pointer">
              <input type="checkbox" value="bs_ketluan" x-model="userModalForm.roles" class="rounded text-emerald-600 focus:ring-emerald-500">
              <span class="font-medium text-slate-800">bs_ketluan</span>
              <span class="text-[10.5px] text-slate-500">(Kết luận)</span>
            </label>

            <label class="flex items-center gap-2 cursor-pointer col-span-2 border-t border-slate-200 pt-1.5 mt-1">
              <input type="checkbox" value="admin" x-model="userModalForm.roles" class="rounded text-purple-600 focus:ring-purple-500">
              <span class="font-bold text-purple-900">admin</span>
              <span class="text-[10.5px] text-purple-700 font-medium">(Toàn quyền hệ thống & mở khóa hồ sơ)</span>
            </label>
          </div>
        </div>
      </div>

      <div class="flex items-center justify-end gap-2 border-t border-slate-100 pt-3">
        <button type="button" @click="showUserModal = false" class="px-3.5 py-1.5 text-slate-600 hover:bg-slate-100 rounded-lg text-xs font-medium">Hủy</button>
        <button type="button" @click="saveUserModal()" class="px-4 py-1.5 bg-slate-900 hover:bg-slate-800 text-white rounded-lg text-xs font-medium shadow-sm">Lưu</button>
      </div>
    </div>
  </div>

  <!-- ===================================================================== -->
  <!-- MODAL CHỈNH SỬA MỤC DANH MỤC                                          -->
  <!-- ===================================================================== -->
  <div x-show="showCatalogModal" x-cloak class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/40 backdrop-blur-xs no-print">
    <div class="bg-white rounded-2xl shadow-2xl border border-slate-200 w-full max-w-md p-6 space-y-4">
      <div class="flex items-center justify-between border-b border-slate-100 pb-3">
        <h3 class="font-bold text-slate-900 text-sm">Chỉnh sửa mục danh mục</h3>
        <button type="button" @click="showCatalogModal = false" class="text-slate-400 hover:text-slate-600">✕</button>
      </div>

      <div class="space-y-3 text-xs">
        <div>
          <label class="label-title">Loại danh mục:</label>
          <input type="text" :value="catalogModalForm.cat_type" disabled class="input-box bg-slate-100 font-mono font-bold text-slate-700" />
        </div>

        <div>
          <label class="label-title">Mã mục <span class="text-red-500">*</span>:</label>
          <input type="text" x-model="catalogModalForm.code" class="input-box font-mono" placeholder="Mã..." />
        </div>

        <div>
          <label class="label-title">Tên mục / Tiêu chuẩn <span class="text-red-500">*</span>:</label>
          <textarea x-model="catalogModalForm.name" rows="3" class="input-box" placeholder="Tên hiển thị..."></textarea>
        </div>

        <div>
          <label class="label-title">Mã cha / Tham chiếu (nếu có):</label>
          <input type="text" x-model="catalogModalForm.parent_code" class="input-box font-mono" placeholder="Mã cha (ví dụ: mã Tỉnh của Xã)..." />
        </div>
      </div>

      <div class="flex items-center justify-end gap-2 border-t border-slate-100 pt-3">
        <button type="button" @click="showCatalogModal = false" class="px-3.5 py-1.5 text-slate-600 hover:bg-slate-100 rounded-lg text-xs font-medium">Hủy</button>
        <button type="button" @click="saveCatalogModal()" :disabled="catalogModalSaving" class="px-4 py-1.5 bg-sky-600 hover:bg-sky-700 text-white rounded-lg text-xs font-medium shadow-sm transition-colors">
          <span x-text="catalogModalSaving ? 'Đang lưu...' : 'Cập nhật'"></span>
        </button>
      </div>
    </div>
  </div>

  <!-- SCRIPT ALPINE.JS & LOGIC -->
  <script src="/static/js/app.js"></script>
</body>
</html>
