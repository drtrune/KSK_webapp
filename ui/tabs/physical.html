<!-- TAB 3: KHÁM THỂ LỰC (BS_THELUC) -->
<div x-show="activeTab === 'physical' && activeRecordTemplate === 'TREN_18'" class="space-y-4 no-print">
  <fieldset :disabled="!isCurrentTabEditable()" class="bg-white rounded-xl p-5 border border-slate-200 shadow-sm space-y-5">
    <div class="flex items-center justify-between border-b border-slate-100 pb-3">
      <div class="flex items-center gap-2">
        <span class="w-2.5 h-2.5 rounded-full bg-indigo-500"></span>
        <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-800">3. Khám Thể lực & Chỉ số Sinh tồn</h2>
      </div>
      <div class="flex items-center gap-3">
        <!-- Nhãn hiển thị Cán bộ khám thể lực tự động -->
        <div class="text-xs flex items-center gap-1.5 bg-slate-50 px-2.5 py-1 rounded-lg border border-slate-200">
          <span class="text-slate-500">Cán bộ khám thể lực:</span>
          <span class="font-semibold text-sky-700" x-text="form.BS_THE_LUC || (canEditPhysical ? (currentUser?.full_name || 'Tự động theo user') : 'Chưa có')"></span>
        </div>
        <span x-show="isSaved && !isSectionEditing('physical')" class="text-slate-500 bg-slate-100 px-2.5 py-0.5 rounded border border-slate-200 text-xs">Chế độ xem (Bấm Sửa để thay đổi)</span>
        <span x-show="isSaved && isSectionEditing('physical')" class="text-indigo-800 bg-indigo-50 px-2.5 py-0.5 rounded border border-indigo-200 text-xs font-medium">Đang chỉnh sửa</span>
        <span x-show="!canUnlockSection('physical')" class="text-amber-600 bg-amber-50 px-2 py-0.5 rounded border border-amber-200 text-xs">Chỉ xem (Cần quyền Khám thể lực hoặc Admin)</span>
      </div>
    </div>

    <!-- Hàng 1: Chiều cao, Cân nặng, BMI (tự động tính) -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <div>
        <label class="label-title">Chiều cao (cm) <span class="text-red-500">*</span></label>
        <input type="number" step="0.1" x-model="form.CHIEU_CAO" @input="calcBmi()" placeholder="Ví dụ: 168.5" class="input-box font-medium" />
      </div>
      <div>
        <label class="label-title">Cân nặng (kg) <span class="text-red-500">*</span></label>
        <input type="number" step="0.1" x-model="form.CAN_NANG" @input="calcBmi()" placeholder="Ví dụ: 62.0" class="input-box font-medium" />
      </div>
      <div>
        <label class="label-title">Chỉ số BMI (Tự động tính = kg / m²)</label>
        <div class="flex items-center">
          <input type="text" x-model="form.CHI_SO_BMI" readonly class="input-box bg-slate-100 font-bold text-indigo-700" placeholder="Tự động tính..." />
          <span class="ml-2 text-xs text-slate-500" x-show="form.CHI_SO_BMI">
            <span x-text="parseFloat(form.CHI_SO_BMI) < 18.5 ? '(Gầy)' : (parseFloat(form.CHI_SO_BMI) <= 24.9 ? '(Bình thường)' : '(Tiền béo phì / Thừa cân)')"></span>
          </span>
        </div>
      </div>
    </div>

    <!-- Hàng 2: Mạch, Huyết áp, Phân loại thể lực -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <div>
        <div class="flex items-center justify-between mb-1">
          <label class="label-title mb-0">Mạch (lần/phút)</label>
          <span x-show="form.MACH" class="text-[10px] font-bold px-2 py-0.5 rounded shadow-2xs" :class="'score-' + getMachScore()" x-text="'Loại ' + getMachScore()"></span>
        </div>
        <input type="number" x-model="form.MACH" @input="recalcCardioScores()" placeholder="Ví dụ: 78" class="input-box" />
      </div>
      <div>
        <div class="flex items-center justify-between mb-1">
          <label class="label-title mb-0">Huyết áp (mmHg)</label>
          <span x-show="form.HUYET_AP" class="text-[10px] font-bold px-2 py-0.5 rounded shadow-2xs" :class="'score-' + getHuyetApScore()" x-text="'Loại ' + getHuyetApScore()"></span>
        </div>
        <input type="text" x-model="form.HUYET_AP" @input="recalcCardioScores()" placeholder="Ví dụ: 120/80" class="input-box" />
      </div>
      <div>
        <label class="label-title">Phân loại thể lực <span class="text-red-500">*</span></label>
        <select x-model="form.KHAM_THE_LUC_PL" class="input-box font-medium text-slate-800">
          <option value="1">Loại 1 - Rất tốt</option>
          <option value="2">Loại 2 - Tốt</option>
          <option value="3">Loại 3 - Khá</option>
          <option value="4">Loại 4 - Trung bình</option>
          <option value="5">Loại 5 - Yếu</option>
        </select>
      </div>
    </div>
  </fieldset>
</div>
