<!-- TAB 6: KẾT LUẬN & KÝ KHÓA HỒ SƠ -->
<div x-show="activeTab === 'conclusion'" class="space-y-4 no-print">
  <fieldset :disabled="!canEditConclusion" class="card-panel p-5 space-y-5">
    <div class="flex items-center justify-between border-b border-[#E2E8F0] pb-3">
      <div class="flex items-center gap-2">
        <span class="w-2.5 h-2.5 rounded-full bg-[#2ECC71]"></span>
        <h3 class="text-sm font-semibold uppercase tracking-wider text-[#2C3E50]">6. Kết luận & Phân loại Sức khỏe</h3>
      </div>
      <div class="text-xs text-[#7F8C8D] flex items-center gap-2">
        <span x-show="isLocked" class="bg-[#FDEDEC] text-[#C0392B] font-bold px-2.5 py-0.5 rounded-full border border-[#FADBD8]">ĐÃ KHÓA HỒ SƠ (STATUS = 1)</span>
        <span x-show="!isLocked" class="bg-[#E8F8F5] text-[#1E8449] font-medium px-2.5 py-0.5 rounded-full border border-[#D4EFDF]">Đang mở (Status = 0)</span>
      </div>
    </div>

    <!-- Phân loại sức khỏe & Bác sĩ kết luận -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
      <div>
        <label class="label-title">Phân loại sức khỏe (theo quy định của Bộ Y tế) <span class="text-red-500">*</span></label>
        <select x-model="form.PHAN_LOAI_SK" class="input-box font-bold text-slate-900 bg-slate-50 text-sm">
          <option value="1">Loại I - Rất khỏe</option>
          <option value="2">Loại II - Khỏe</option>
          <option value="3">Loại III - Trung bình</option>
          <option value="4">Loại IV - Yếu</option>
          <option value="5">Loại V - Rất yếu</option>
        </select>
      </div>

      <div>
        <label class="label-title">Bác sĩ Kết luận (Ký, ghi rõ họ tên):</label>
        <input type="text" x-model="form.BS_KET_LUAN" placeholder="BS.CKII Nguyễn Văn..." class="input-box text-sm font-medium" />
      </div>
    </div>

    <!-- Tình trạng sức khỏe / Bệnh mắc phải -->
    <div>
      <label class="label-title">1. Tình trạng sức khỏe & Kết luận chuyên môn <span class="text-red-500">*</span></label>
      <textarea x-model="form.KET_LUAN_BENH" rows="3" placeholder="Đủ sức khỏe học tập và công tác..." class="input-box text-xs"></textarea>
    </div>

    <!-- Mã ICD-10 Đa chọn (Multi-select linking to ICD-10 Catalog via Tom Select) -->
    <div class="space-y-1.5">
      <div class="flex items-center justify-between">
        <label class="label-title mb-0">2. Các bệnh, tật nếu có (Mã ICD-10 - Cho phép tìm kiếm và chọn nhiều mã):</label>
        <span class="text-[11px] text-slate-500">Liên kết danh mục ICD-10 Bộ Y tế</span>
      </div>
      
      <!-- Component Tom Select ICD-10 -->
      <div wire:ignore>
        <select id="select_cac_benh_tat_icd" multiple x-init="initIcdMultiSelect($el, 'CAC_BENH_TAT_NEU_CO')" class="input-box text-xs">
        </select>
      </div>
      <div class="text-[11px] text-slate-500 italic">
        * Bạn có thể gõ mã bệnh (ví dụ: I10, E11, J00) hoặc tên bệnh (ví dụ: tăng huyết áp, đái tháo đường) để chọn nhiều mã cùng lúc.
      </div>
    </div>
  </fieldset>

  <!-- Nút Hành động Kết luận & Khóa hồ sơ -->
  <div class="flex flex-wrap items-center justify-between gap-3 bg-white p-4 rounded-xl border border-[#E2E8F0] shadow-xs">
    <div class="flex items-center gap-2">
      <!-- Mở khóa (Chỉ Admin) -->
      <button x-show="isAdmin && isLocked" type="button" @click="handleUnlock()" :disabled="unlocking" class="px-4 py-2 bg-amber-600 hover:bg-amber-700 text-white rounded-lg font-medium text-xs flex items-center gap-2 shadow-xs transition-colors">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 11V7a4 4 0 118 0m-4 8v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2z"/></svg>
        <span x-text="unlocking ? 'Đang mở khóa...' : 'Mở khóa hồ sơ (Admin)'"></span>
      </button>

      <!-- Khóa hồ sơ (BS Kết Luận hoặc Admin) -->
      <button x-show="!isLocked && (isDoctorKetLuan || isAdmin)" type="button" @click="handleLock()" :disabled="!isSaved || locking" class="px-4 py-2 bg-[#E74C3C] hover:bg-[#C0392B] disabled:opacity-50 text-white rounded-lg font-medium text-xs flex items-center gap-2 shadow-xs transition-colors">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
        <span x-text="locking ? 'Đang khóa...' : 'Ký & Khóa hồ sơ'"></span>
      </button>
    </div>

    <div class="flex items-center gap-2">
      <button type="button" @click="handleSave()" :disabled="isLocked || !canEditConclusion || saving" class="px-5 py-2 bg-[#2ECC71] hover:bg-[#27AE60] disabled:opacity-50 text-white rounded-lg font-medium text-xs flex items-center gap-2 shadow-xs transition-colors">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"/></svg>
        <span x-text="saving ? 'Đang lưu...' : 'Lưu kết luận'"></span>
      </button>

      <button type="button" @click="printFullRecord()" :disabled="!isSaved" :class="isSaved ? 'bg-[#2C3E50] hover:bg-[#1A252F] text-white' : 'bg-[#F4F6F8] text-[#7F8C8D] cursor-not-allowed border border-[#E2E8F0]'" class="px-4 py-2 rounded-lg font-medium text-xs flex items-center gap-2 transition-colors shadow-xs">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"/></svg>
        <span>In phiếu KSK hoàn chỉnh</span>
      </button>

      <button type="button" @click="downloadDocx('full')" :disabled="!isSaved" :class="isSaved ? 'bg-white hover:bg-[#F4F6F8] text-[#2C3E50] border border-[#E2E8F0]' : 'bg-[#F4F6F8] text-[#7F8C8D] cursor-not-allowed border border-[#E2E8F0]'" class="px-3 py-2 rounded-lg font-medium text-xs flex items-center gap-1.5 transition-colors shadow-xs">
        <svg class="w-4 h-4 text-[#3498DB]" fill="currentColor" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6zM6 20V4h7v5h5v11H6z"/></svg>
        <span>Tải Word hoàn chỉnh</span>
      </button>
    </div>
  </div>
</div>
