<!-- TAB KHÁM ĐOÀN & HỢP ĐỒNG -->
<div x-show="activeTab === 'group'" class="space-y-4 no-print">
  <div class="bg-white rounded-xl p-5 border border-slate-200 shadow-sm space-y-4">
    <div class="flex items-center justify-between flex-wrap gap-3 border-b border-slate-100 pb-3">
      <div>
        <h3 class="text-sm font-bold text-slate-900">🏢 Công ty & Hợp đồng Khám đoàn</h3>
        <p class="text-xs text-slate-500">Tạo công ty, hợp đồng khám đoàn, import danh sách nhân viên (Excel/CSV) và in phiếu cả đoàn.</p>
      </div>
      <div class="flex items-center gap-2">
        <button type="button" @click="openCompanyModal()" class="px-3 py-1.5 bg-sky-600 hover:bg-sky-700 text-white rounded-lg text-xs font-semibold">+ Thêm Công ty</button>
        <button type="button" @click="openContractModal()" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-900 text-white rounded-lg text-xs font-semibold">+ Thêm Hợp đồng</button>
        <button type="button" @click="loadGroupData()" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-xs font-medium">↻ Làm mới</button>
      </div>
    </div>

    <!-- Danh sách Công ty & Hợp đồng -->
    <div class="space-y-3">
      <template x-if="groupCompanies.length === 0">
        <div class="p-6 text-center text-xs text-slate-400 border border-dashed border-slate-200 rounded-xl">
          Chưa có công ty nào. Nhấn "+ Thêm Công ty" để bắt đầu.
        </div>
      </template>

      <template x-for="comp in groupCompanies" :key="comp.id">
        <div class="border border-slate-200 rounded-xl overflow-hidden">
          <div class="p-3.5 bg-slate-50 flex items-center justify-between flex-wrap gap-2">
            <div class="flex items-center gap-2">
              <span class="px-2 py-0.5 rounded bg-sky-100 text-sky-800 font-mono text-[11px] font-bold" x-text="comp.code"></span>
              <span class="font-bold text-slate-900 text-xs" x-text="comp.name"></span>
              <span class="px-2 py-0.5 rounded-full text-[10px] font-semibold"
                    :class="comp.is_active ? 'bg-emerald-100 text-emerald-700' : 'bg-red-100 text-red-700'"
                    x-text="comp.is_active ? 'Đang hoạt động' : 'Đã khóa'"></span>
            </div>
            <div class="flex items-center gap-2 text-xs">
              <button type="button" @click="openContractModal(null, comp.id)" class="px-2.5 py-1 bg-sky-50 text-sky-700 hover:bg-sky-100 rounded font-medium">+ Thêm HĐ</button>
              <button type="button" @click="openCompanyModal(comp)" class="px-2.5 py-1 bg-white border border-slate-200 text-slate-700 hover:bg-slate-100 rounded font-medium">Sửa</button>
            </div>
          </div>

          <div class="p-3 space-y-2 bg-white">
            <template x-for="ct in groupContracts.filter(c => c.company_id === comp.id)" :key="ct.id">
              <div class="p-3 rounded-lg border border-slate-200 bg-slate-50/50 flex items-center justify-between flex-wrap gap-2">
                <div class="space-y-0.5">
                  <div class="flex items-center gap-2 flex-wrap">
                    <span class="px-2 py-0.5 rounded bg-emerald-100 text-emerald-800 font-mono text-[11px] font-bold" x-text="ct.contract_code"></span>
                    <span class="font-semibold text-slate-900 text-xs" x-text="ct.title"></span>
                    <span class="text-[11px] text-slate-500" x-text="'(' + (ct.default_templates || 'TREN_18') + ')'"></span>
                  </div>
                  <div class="text-[11px] text-slate-500">
                    <span x-text="'Ngày khám: ' + (ct.exam_date || '-')"></span> ·
                    <span x-text="'Hồ sơ: ' + ct.total_records + '/' + ct.expected_count"></span> ·
                    <span x-text="'Hoàn tất: ' + ct.done_records"></span>
                  </div>
                </div>
                <div class="flex items-center gap-1.5 flex-wrap text-xs">
                  <button type="button" @click="openGroupImportModal(ct)" class="px-2.5 py-1 bg-emerald-600 hover:bg-emerald-700 text-white rounded font-medium">📥 Import Excel/CSV</button>
                  <button type="button" @click="openContractRecords(ct)" class="px-2.5 py-1 bg-sky-600 hover:bg-sky-700 text-white rounded font-medium">👥 Danh sách</button>
                  <button type="button" @click="printContractPdf(ct.id, true)" class="px-2.5 py-1 bg-white border border-slate-300 hover:bg-slate-100 text-slate-700 rounded font-medium">🖨 In Tiếp nhận</button>
                  <button type="button" @click="printContractPdf(ct.id, false)" class="px-2.5 py-1 bg-slate-800 hover:bg-slate-900 text-white rounded font-medium">📄 In KSK Đoàn</button>
                  <button type="button" @click="openContractModal(ct)" class="px-2.5 py-1 bg-white border border-slate-200 hover:bg-slate-100 text-slate-700 rounded font-medium">Sửa</button>
                </div>
              </div>
            </template>
          </div>
        </div>
      </template>
    </div>

    <!-- Danh sách nhân viên thuộc Hợp đồng đang xem -->
    <div x-show="selectedContractForView" class="pt-4 border-t border-slate-200 space-y-3">
      <div class="flex items-center justify-between">
        <div class="text-xs font-bold text-slate-900" x-text="'Danh sách nhân viên — ' + (selectedContractForView?.contract_code || '') + ' (' + groupContractRecords.length + ' hồ sơ)'"></div>
        <button type="button" @click="selectedContractForView = null" class="text-xs text-slate-500 hover:text-slate-800">Đóng danh sách</button>
      </div>
      <div tabindex="0" role="region" aria-label="Danh sách nhân viên hợp đồng" class="overflow-x-auto border border-slate-200 rounded-lg max-h-80 overflow-y-auto">
        <table class="w-full text-left border-collapse text-xs">
          <thead>
            <tr class="bg-slate-50 text-slate-700 font-semibold border-b border-slate-200">
              <th class="py-2 px-3">Mã TN</th>
              <th class="py-2 px-3">Họ và tên</th>
              <th class="py-2 px-3">Ngày sinh</th>
              <th class="py-2 px-3">Mẫu phiếu</th>
              <th class="py-2 px-3">Trạng thái</th>
              <th class="py-2 px-3 text-right">Thao tác</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-slate-100 bg-white">
            <template x-for="r in groupContractRecords" :key="r.id">
              <tr class="hover:bg-slate-50">
                <td class="py-2 px-3 font-mono font-medium text-slate-800" x-text="r.ma_tiep_nhan"></td>
                <td class="py-2 px-3 font-semibold text-slate-900" x-text="r.ho_ten"></td>
                <td class="py-2 px-3" x-text="r.ngay_sinh"></td>
                <td class="py-2 px-3 font-mono text-[11px]" x-text="r.exam_templates"></td>
                <td class="py-2 px-3">
                  <span class="px-2 py-0.5 rounded text-[10.5px] font-semibold"
                        :class="r.status >= 1 ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-800'"
                        x-text="r.status >= 2 ? 'Đã khóa' : (r.status === 1 ? 'Hoàn tất' : 'Đang khám')"></span>
                </td>
                <td class="py-2 px-3 text-right">
                  <button type="button" @click="selectRecord(r); activeTab = 'reception'" class="text-sky-600 hover:underline font-semibold">Mở khám →</button>
                </td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
