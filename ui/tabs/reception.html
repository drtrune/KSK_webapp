<!-- TAB 1: TIẾP NHẬN HÀNH CHÍNH -->
<div x-show="activeTab === 'reception'" class="space-y-4 no-print">
  <fieldset :disabled="!isCurrentTabEditable()" class="card-panel p-5 space-y-4">
    <div class="flex items-center justify-between border-b border-[#E2E8F0] pb-3">
      <div class="flex items-center gap-2">
        <span class="w-2.5 h-2.5 rounded-full bg-[#3498DB]"></span>
        <h2 class="text-sm font-semibold uppercase tracking-wider text-[#2C3E50]">1. Thông tin Hành chính & Tiếp nhận</h2>
      </div>
      <div class="text-xs text-[#7F8C8D] flex items-center gap-2">
        <span x-show="isSaved && !isSectionEditing('reception')" class="text-slate-500 bg-slate-100 px-2.5 py-0.5 rounded border border-slate-200">Chế độ xem (Bấm Sửa để thay đổi)</span>
        <span x-show="isSaved && isSectionEditing('reception')" class="text-amber-800 bg-amber-50 px-2.5 py-0.5 rounded border border-amber-200 font-medium">Đang chỉnh sửa</span>
        <span x-show="!canUnlockSection('reception')" class="text-amber-700 bg-amber-50 px-2 py-0.5 rounded border border-amber-200">Chỉ xem (Cần quyền Lễ tân hoặc Admin)</span>
      </div>
    </div>

    <!-- Hàng 1: Mã tiếp nhận, Mã y tế, Ngày vào khám -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <div>
        <label class="label-title">Mã tiếp nhận <span class="text-red-500">*</span></label>
        <div class="flex gap-2">
          <input type="text" x-model="form.MA_TIEP_NHAN" placeholder="TN.2611.xxxx" class="input-box font-medium text-sky-900 bg-sky-50/50" />
          <button type="button" @click="handleSearchOrHis()" :disabled="searchLoading" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-900 text-white rounded-lg text-xs font-medium flex items-center gap-1.5 whitespace-nowrap transition-colors">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
            <span x-text="searchLoading ? 'Đang tải...' : 'Lấy HIS'"></span>
          </button>
        </div>
        <!-- Gợi ý mã mẫu thử nghiệm Mock API HIS -->
        <div class="flex items-center gap-1.5 mt-1.5 text-[11px] text-slate-500">
          <span>Mã mẫu Mock HIS:</span>
          <button type="button" @click="handleSearchOrHis('TN.2611.0004018')" class="text-sky-700 hover:underline font-mono bg-sky-50 px-1.5 py-0.2 rounded border border-sky-200" title="Bệnh nhân Nam 2000">TN.2611.0004018</button>
          <button type="button" @click="handleSearchOrHis('TN.2611.0004019')" class="text-pink-700 hover:underline font-mono bg-pink-50 px-1.5 py-0.2 rounded border border-pink-200" title="Bệnh nhân Nữ 1995">TN.2611.0004019</button>
        </div>
      </div>
      <div>
        <label class="label-title">Mã y tế (Mã BN)</label>
        <input type="text" x-model="form.MA_Y_TE" placeholder="2300xxxx" class="input-box" />
      </div>
      <div>
        <label class="label-title">Ngày vào khám (DD/MM/YYYY) <span class="text-red-500">*</span></label>
        <div class="relative">
          <input type="text" x-model="form.NGAY_VAO" x-init="initDatePicker($el, 'NGAY_VAO')" placeholder="DD/MM/YYYY" class="input-box bg-white pr-8" />
          <span class="pointer-events-none absolute right-2.5 top-2 text-slate-400 text-xs">📅</span>
        </div>
      </div>
    </div>

    <!-- Hàng 2: Họ tên, Giới tính, Ngày sinh, CCCD -->
    <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
      <div class="md:col-span-2">
        <label class="label-title">Họ và tên bệnh nhân <span class="text-red-500">*</span></label>
        <input type="text" x-model="form.HO_TEN" placeholder="NGUYỄN VĂN A" class="input-box uppercase font-semibold text-slate-900" />
      </div>
      <div>
        <label class="label-title">Giới tính <span class="text-red-500">*</span></label>
        <div class="flex items-center gap-4 bg-white px-3 py-2 rounded-lg border border-[#E2E8F0]">
          <label class="inline-flex items-center gap-1.5 cursor-pointer text-xs">
            <input type="radio" name="GIOI_TINH" value="1" x-model="form.GIOI_TINH" class="text-sky-600 focus:ring-sky-500" />
            <span class="font-medium text-slate-800">1 - Nam</span>
          </label>
          <label class="inline-flex items-center gap-1.5 cursor-pointer text-xs">
            <input type="radio" name="GIOI_TINH" value="2" x-model="form.GIOI_TINH" class="text-pink-600 focus:ring-pink-500" />
            <span class="font-medium text-slate-800">2 - Nữ</span>
          </label>
        </div>
      </div>
      <div>
        <label class="label-title">Ngày sinh (DD/MM/YYYY) <span class="text-red-500">*</span></label>
        <div class="relative">
          <input type="text" x-model="form.NGAY_SINH" x-init="initDatePicker($el, 'NGAY_SINH')" placeholder="31/01/2000" class="input-box bg-white pr-8" />
          <span class="pointer-events-none absolute right-2.5 top-2 text-slate-400 text-xs">📅</span>
        </div>
      </div>
    </div>

    <!-- Hàng 3: CCCD, Ngày cấp, Nơi cấp -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <div>
        <label class="label-title">Số CCCD / Định danh cá nhân <span class="text-red-500">*</span></label>
        <input type="text" x-model="form.SO_CCCD" maxlength="12" placeholder="0260xxxxxxxx" class="input-box font-mono" />
      </div>
      <div>
        <label class="label-title">Ngày cấp CCCD (DD/MM/YYYY)</label>
        <div class="relative">
          <input type="text" x-model="form.NGAYCAP_CCCD" x-init="initDatePicker($el, 'NGAYCAP_CCCD')" placeholder="DD/MM/YYYY" class="input-box bg-white pr-8" />
          <span class="pointer-events-none absolute right-2.5 top-2 text-slate-400 text-xs">📅</span>
        </div>
      </div>
      <div>
        <label class="label-title">Nơi cấp CCCD (Tìm kiếm hoặc gõ mới)</label>
        <select id="select_noicap_cccd" class="input-box"></select>
      </div>
    </div>

    <!-- Hàng 4: Dân tộc, Nghề nghiệp, Số điện thoại, Nhóm máu -->
    <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
      <div>
        <label class="label-title">Dân tộc (Tìm kiếm)</label>
        <select id="select_ma_dan_toc" class="input-box"></select>
      </div>
      <div>
        <label class="label-title">Nghề nghiệp (Tìm kiếm theo mã/tên)</label>
        <select id="select_ma_nghe_nghiep" class="input-box"></select>
      </div>
      <div>
        <label class="label-title">Số điện thoại liên hệ</label>
        <input type="text" x-model="form.DIEN_THOAI" placeholder="09xxxxxxx" class="input-box" />
      </div>
      <div>
        <div class="flex items-center justify-between">
          <label class="label-title mb-0">Nhóm máu (Có thể để trống)</label>
          <button x-show="form.NHOM_MAU && isCurrentTabEditable()" type="button" @click="clearBloodGroup()" class="text-[11px] text-red-600 hover:underline font-medium">✕ Xóa</button>
        </div>
        <select id="select_nhom_mau" class="input-box"></select>
      </div>
    </div>

    <!-- Hàng 5: Địa chỉ thường trú (Tỉnh/TP, Xã/Phường, Chi tiết) -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <div>
        <label class="label-title">Tỉnh / Thành phố cư trú (Tìm kiếm)</label>
        <select id="select_matinh_cu_tru" class="input-box"></select>
      </div>
      <div>
        <label class="label-title">Phường / Xã cư trú (Tìm kiếm)</label>
        <select id="select_maxa_cu_tru" class="input-box"></select>
      </div>
      <div>
        <label class="label-title">Số nhà, thôn xóm, đường phố</label>
        <input type="text" x-model="form.DIA_CHI" placeholder="Số 123 Đường B..." class="input-box" />
      </div>
    </div>

    <!-- Hàng 6: Đối tượng, Nguồn chi trả, Đơn vị công tác/học tập -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <div>
        <label class="label-title">Đối tượng KSK (Tìm kiếm)</label>
        <select id="select_doi_tuong" class="input-box"></select>
      </div>
      <div>
        <label class="label-title">Nguồn chi trả (Tìm kiếm)</label>
        <select id="select_nguon_chi_tra" class="input-box"></select>
      </div>
      <div>
        <label class="label-title">Nơi làm việc / Học tập</label>
        <input type="text" x-model="form.NOI_LAM_VIEC_HOC_TAP" placeholder="Công ty CP / Trường THPT..." class="input-box" />
      </div>
    </div>

    <!-- Hàng 7: Lý do vào viện -->
    <div>
      <label class="label-title">Lý do khám sức khỏe / vào viện <span class="text-red-500">*</span></label>
      <input type="text" x-model="form.LY_DO_VV" placeholder="Khám sức khỏe đi làm / đi học / định kỳ..." class="input-box" />
      <input type="hidden" x-model="form.MA_LOAI_KCB" value="15" />
    </div>

    <!-- Hàng 8: Thông tin bổ sung theo Mẫu Phiếu KSK đang chọn -->
    <div x-show="activeRecordTemplate === 'LAI_XE'" class="p-3 rounded-lg bg-amber-50/70 border border-amber-200 grid grid-cols-1 md:grid-cols-2 gap-3" x-cloak>
      <div>
        <label class="label-title">Hạng bằng lái xe (Mẫu Lái xe)</label>
        <select x-model="form.HANG_BANG_LAI" class="input-box text-xs bg-white">
          <option value="">-- Chọn hạng --</option>
          <option value="A1">A1</option><option value="A">A</option><option value="B1">B1</option>
          <option value="B">B</option><option value="C1">C1</option><option value="C">C</option>
          <option value="D1">D1</option><option value="D2">D2</option><option value="D">D</option>
          <option value="BE">BE</option><option value="CE">CE</option><option value="DE">DE</option>
        </select>
      </div>
    </div>

    <div x-show="['HOC_SINH','MAU_GIAO'].includes(activeRecordTemplate)" class="p-3 rounded-lg bg-sky-50/70 border border-sky-200 grid grid-cols-1 md:grid-cols-4 gap-3" x-cloak>
      <div class="md:col-span-2">
        <label class="label-title">Tên Cơ sở giáo dục (Trường / Lớp)</label>
        <input type="text" x-model="form.TEN_CSGD" placeholder="Trường Tiểu học / Mầm non..." class="input-box text-xs bg-white" />
      </div>
      <div>
        <label class="label-title">Mã CSGD</label>
        <input type="text" x-model="form.MA_CSGD" placeholder="Mã trường..." class="input-box text-xs bg-white" />
      </div>
      <div>
        <label class="label-title">Giờ khám</label>
        <input type="text" x-model="form.GIO_KHAM" placeholder="08:00" class="input-box text-xs bg-white" />
      </div>
    </div>

    <div x-show="['DUOI_6','TU_6_DEN_18','MAU_GIAO','HOC_SINH'].includes(activeRecordTemplate)" class="p-3 rounded-lg bg-emerald-50/60 border border-emerald-200 grid grid-cols-1 md:grid-cols-4 gap-3" x-cloak>
      <div>
        <label class="label-title">Họ tên Người giám hộ / Cha mẹ</label>
        <input type="text" x-model="form.NGUOI_GIAM_HO" placeholder="Họ tên người giám hộ..." class="input-box text-xs bg-white" />
      </div>
      <div>
        <label class="label-title">Quan hệ với trẻ</label>
        <input type="text" x-model="form.MOI_QUAN_HE_VOI_TRE" placeholder="Bố / Mẹ / Ông / Bà..." class="input-box text-xs bg-white" />
      </div>
      <div>
        <label class="label-title">SĐT Người giám hộ</label>
        <input type="text" x-model="form.DIEN_THOAI_NGH" placeholder="09xx..." class="input-box text-xs bg-white" />
      </div>
      <div>
        <label class="label-title">CCCD Người giám hộ</label>
        <input type="text" x-model="form.SO_CCCD_NGH" placeholder="Số CCCD..." class="input-box text-xs bg-white" />
      </div>
    </div>

    <div x-show="activeRecordTemplate === 'DUOI_6'" class="p-3 rounded-lg bg-pink-50/60 border border-pink-200 grid grid-cols-1 md:grid-cols-2 gap-3" x-cloak>
      <div>
        <label class="label-title">Sinh non / Đẻ non</label>
        <div class="flex items-center gap-4 bg-white px-3 py-2 rounded-lg border border-pink-200">
          <label class="inline-flex items-center gap-1.5 cursor-pointer text-xs">
            <input type="radio" name="SINH_NON" value="0" x-model="form.SINH_NON" class="text-sky-600 focus:ring-sky-500" />
            <span class="font-medium text-slate-700">0 - Không (Đủ tháng)</span>
          </label>
          <label class="inline-flex items-center gap-1.5 cursor-pointer text-xs">
            <input type="radio" name="SINH_NON" value="1" x-model="form.SINH_NON" class="text-pink-600 focus:ring-pink-500" />
            <span class="font-medium text-pink-700">1 - Có (Sinh non)</span>
          </label>
        </div>
      </div>
      <div>
        <label class="label-title">Số tuần thai khi sinh</label>
        <input type="text" x-model="form.TUAN_THAI" placeholder="VD: 38 tuần" class="input-box text-xs bg-white" />
      </div>
    </div>
  </fieldset>
</div>
