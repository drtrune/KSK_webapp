<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <title>Hệ thống Khám Sức Khỏe</title>

  <!-- TAILWINDCSS & ALPINE.JS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="/static/js/alpine.min.js"></script>

  <!-- FLATPICKR (DAYPICKER - FORMAT DD/MM/YYYY) -->
  <link rel="stylesheet" href="/static/css/flatpickr.min.css">
  <script src="/static/js/flatpickr.min.js"></script>
  <script src="/static/js/flatpickr.vn.js"></script>

  <!-- TOM SELECT (SEARCHABLE DROPDOWN & MULTI-SELECT ICD-10) -->
  <link rel="stylesheet" href="/static/css/tom-select.bootstrap5.min.css">
  <script src="/static/js/tom-select.complete.min.js"></script>

  <!-- JSBARCODE (BARCODE CODE128 OFFLINE) -->
  <script src="/static/js/JsBarcode.all.min.js"></script>

  <!-- DANH MỤC PHÂN LOẠI SỨC KHỎE (TỰ ĐỘNG XUẤT TỪ ASSET/PHAN_LOAI.XLSX) -->
  <script src="/static/js/phan_loai_config.js"></script>

  <!-- CUSTOM STYLESHEET (DESIGN SYSTEM SPEC - design.md) -->
  <link rel="stylesheet" href="/static/css/style.css">
</head>

<body class="bg-[#F4F6F8] text-[#2C3E50] min-h-screen text-[13.5px]" :class="getBodyClasses()" x-data="kskApp()"
  x-init="initApp()">

  <!-- ===================================================================== -->
  <!-- THÔNG BÁO TOAST - VỊ TRÍ GÓC DƯỚI CÙNG BÊN PHẢI THEO DESIGN.MD       -->
  <!-- ===================================================================== -->
  <div class="fixed top-20 right-3 left-3 sm:left-auto sm:top-auto sm:bottom-16 sm:right-6 z-50 space-y-2 no-print" aria-live="polite">
    <template x-for="t in toasts" :key="t.id">
      <div
        class="px-4 py-3 rounded-xl shadow-lg border flex items-center gap-3 min-w-[280px] max-w-md transition-all text-xs bg-white"
        :class="t.type === 'error' ? 'border-[#E74C3C]/40 text-[#C0392B]' : 'border-[#2ECC71]/40 text-[#27AE60]'">
        <span class="w-2.5 h-2.5 rounded-full shrink-0"
          :class="t.type === 'error' ? 'bg-[#E74C3C]' : 'bg-[#2ECC71]'"></span>
        <div class="font-medium flex-1 text-[#2C3E50]" x-text="t.message"></div>
      </div>
    </template>
  </div>

  <!-- ===================================================================== -->
  <!-- MÀN HÌNH KHỞI TẠO LẦN ĐẦU / ĐĂNG NHẬP                                 -->
  <!-- ===================================================================== -->
  <div x-show="!token" x-cloak class="min-h-screen flex items-center justify-center p-4 bg-[#F4F6F8] no-print">
    <div class="bg-white rounded-2xl shadow-xl border border-[#E2E8F0] w-full max-w-sm p-6 space-y-5">
      <div class="text-center space-y-1">
        <div
          class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-[#3498DB] text-white font-bold text-lg mb-2 shadow-sm">
          KSK</div>
        <h1 class="text-lg font-bold text-[#2C3E50]" x-text="!setupStatus.initialized ? 'Khởi tạo Máy chủ KSK' : 'Đăng nhập Hệ thống'"></h1>
        <p class="text-xs text-[#7F8C8D]">Phần mềm Quản lý Khám Sức Khỏe (Web Server)</p>
      </div>

      <!-- Khởi tạo lần đầu khi DB chưa có Master Key -->
      <div x-show="!setupStatus.initialized" class="space-y-3 text-xs">
        <div x-show="!setupRecoveryKey">
          <div class="space-y-3">
            <div class="p-3 bg-sky-50 border border-sky-200 rounded-lg text-sky-900 text-[11px]">
              Đặt mật khẩu cho tài khoản <strong>admin</strong> để tạo khóa mã hóa AES-256-GCM cho toàn bộ hồ sơ.
            </div>
            <div>
              <label class="label-title">Mật khẩu Admin (tối thiểu 4 ký tự):</label>
              <input type="password" x-model="setupPassword" placeholder="••••••" class="input-box" />
            </div>
            <button type="button" @click="initServerSetup()" class="w-full py-2.5 bg-sky-600 hover:bg-sky-700 text-white rounded-lg font-medium text-xs">
              Khởi tạo Hệ thống & Tạo Recovery Key
            </button>
          </div>
        </div>
        <div x-show="setupRecoveryKey" class="space-y-3">
          <div class="p-3 bg-amber-50 border border-amber-300 rounded-lg space-y-1.5">
            <div class="font-bold text-amber-900">QUAN TRỌNG: Lưu lại Recovery Key sau!</div>
            <div class="font-mono font-bold text-sm text-slate-900 bg-white p-2 rounded border border-amber-200 select-all" x-text="setupRecoveryKey"></div>
          </div>
          <button type="button" @click="setupStatus.initialized = true; setupRecoveryKey = ''" class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg font-medium text-xs">
            Đã lưu Recovery Key — Vào Đăng nhập
          </button>
        </div>
      </div>

      <!-- Form Đăng nhập -->
      <form x-show="setupStatus.initialized && !showRecoverForm" @submit.prevent="handleLogin()" class="space-y-4">
        <div x-show="loginError" x-cloak role="alert"
          class="p-2.5 rounded-lg bg-[#FDEDEC] border border-[#E74C3C]/40 text-[#C0392B] text-xs font-medium flex items-start gap-2">
          <span class="shrink-0 font-bold">⚠</span>
          <span x-text="loginError"></span>
        </div>
        <div>
          <label class="label-title">Tên đăng nhập:</label>
          <input type="text" x-model="loginForm.username" @input="loginError = ''" placeholder="letan / bstheluc / admin..." class="input-box"
            autofocus />
        </div>
        <div>
          <label class="label-title">Mật khẩu:</label>
          <input type="password" x-model="loginForm.password" @input="loginError = ''" placeholder="••••••" class="input-box" />
        </div>
        <button type="submit" :disabled="loginLoading"
          class="w-full py-2.5 bg-[#3498DB] hover:bg-[#2980B9] disabled:opacity-50 text-white rounded-lg font-medium text-xs transition-colors shadow-sm">
          <span x-text="loginLoading ? 'Đang xác thực...' : 'Đăng nhập'"></span>
        </button>
        <div class="text-center">
          <button type="button" @click="showRecoverForm = true" class="text-[11px] text-slate-500 hover:text-sky-600 underline">
            Quên mật khẩu Admin? Khôi phục bằng Recovery Key
          </button>
        </div>
      </form>

      <!-- Form Khôi phục Admin -->
      <form x-show="setupStatus.initialized && showRecoverForm" @submit.prevent="recoverAdminWithKey()" class="space-y-3 text-xs">
        <div>
          <label class="label-title">Recovery Key:</label>
          <input type="text" x-model="recoverForm.recovery_key" placeholder="KSK-XXXX-..." class="input-box font-mono" />
        </div>
        <div>
          <label class="label-title">Mật khẩu Admin mới:</label>
          <input type="password" x-model="recoverForm.new_password" placeholder="••••••" class="input-box" />
        </div>
        <div class="flex gap-2">
          <button type="button" @click="showRecoverForm = false" class="flex-1 py-2 bg-slate-100 text-slate-700 rounded-lg font-medium">Quay lại</button>
          <button type="submit" class="flex-1 py-2 bg-amber-600 hover:bg-amber-700 text-white rounded-lg font-medium">Khôi phục</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ===================================================================== -->
  <!-- GIAO DIỆN CHÍNH (KHI ĐÃ ĐĂNG NHẬP) - 16:9 MINIMALISM YOUTUBE-STYLE     -->
  <!-- ===================================================================== -->
  <div x-show="token" x-cloak class="min-h-screen flex flex-col bg-[#F4F6F8]">

    <!-- 1. THANH ĐIỀU HƯỚNG TRÊN CÙNG (HEADER 64PX THEO DESIGN.MD) -->
    <header class="min-h-16 bg-white border-b border-[#E2E8F0] sticky top-0 z-40 px-2.5 sm:px-4 shadow-xs flex items-center no-print">
      <div class="w-full flex items-center justify-between gap-2 sm:gap-4">

        <!-- Logo & Nút Toggle Hamburger -->
        <div class="flex items-center gap-1.5 sm:gap-3 shrink-0">
          <!-- Nút Hamburger Icon theo design.md 3.1 -->
          <button type="button" @click="sidebarOpen = !sidebarOpen"
            class="p-2 text-[#2C3E50] hover:text-[#3498DB] hover:bg-[#F4F6F8] rounded-full transition-colors"
            aria-label="Mở hoặc đóng danh sách khám"
            title="Thu gọn / Mở rộng Sidebar">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
            </svg>
          </button>

          <div class="flex items-center gap-2 cursor-pointer" @click="resetForm()">
            <span
              class="w-8 h-8 rounded-lg bg-[#3498DB] text-white flex items-center justify-center font-bold text-sm tracking-tight shadow-xs">KSK</span>
            <span class="font-bold text-[#2C3E50] text-sm hidden sm:inline">Khám Sức Khỏe</span>
          </div>
          <span class="text-[#E2E8F0] hidden md:inline">|</span>
          <span class="text-xs text-[#7F8C8D] font-medium hidden lg:inline truncate max-w-xs"
            x-text="facility.ten_cskcb"></span>
        </div>

        <!-- Ô Tìm kiếm YouTube Tối Giản Bo Tròn 20px (design.md 3.1) -->
        <div class="flex-1 min-w-[110px] max-w-xl mx-1 sm:mx-2">
          <form @submit.prevent="handleSearchOrHis()" class="flex items-center">
            <div class="relative w-full flex items-center">
              <input type="text" x-model="searchMaTn" placeholder="Mã tiếp nhận..."
                class="w-full pl-3 sm:pl-4 pr-8 sm:pr-12 py-2 rounded-l-full border border-r-0 border-[#E2E8F0] focus:outline-none focus:border-[#3498DB] text-xs text-[#2C3E50] bg-[#FFFFFF] shadow-inner" />
              <!-- Nút xóa nhanh nội dung tìm kiếm -->
              <button type="button" x-show="searchMaTn" @click="searchMaTn = ''"
                class="absolute right-2 text-[#7F8C8D] hover:text-[#2C3E50] p-0.5 rounded-full" title="Xóa nhanh" aria-label="Xóa tìm kiếm">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
              </button>
            </div>
            <button type="submit" :disabled="searchLoading"
              class="px-3 sm:px-5 py-2 bg-[#F4F6F8] hover:bg-[#E2E8F0] border border-[#E2E8F0] rounded-r-full text-[#2C3E50] text-xs font-medium flex items-center gap-1.5 transition-colors shadow-xs shrink-0"
              aria-label="Tìm kiếm"
              title="Tìm kiếm">
              <svg class="w-3.5 h-3.5 text-[#2C3E50]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
              </svg>
              <span class="hidden sm:inline">Tìm</span>
            </button>
          </form>
        </div>

        <!-- Icon Chuông (chấm xanh #2ECC71), Tạo mới & User Avatar -->
        <div class="flex items-center gap-1.5 sm:gap-2.5 shrink-0">
          <!-- Nút Tạo mới -->
          <button type="button" @click="resetForm()"
            class="px-2.5 sm:px-3.5 py-1.5 bg-[#F4F6F8] hover:bg-[#E2E8F0] text-[#2C3E50] rounded-lg text-xs font-medium transition-colors border border-[#E2E8F0] flex items-center gap-1.5 shadow-xs"
            aria-label="Tạo hồ sơ mới"
            title="Tạo hồ sơ mới">
            <svg class="w-3.5 h-3.5 text-[#3498DB]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
            </svg>
            <span class="hidden sm:inline">Mới</span>
          </button>

          <!-- Xuất CSV -->
          <button type="button" @click="openExportTab()"
            class="hidden sm:flex px-3 py-1.5 bg-[#FFFFFF] hover:bg-[#F4F6F8] text-[#27AE60] border border-[#2ECC71]/40 rounded-lg text-xs font-medium items-center gap-1.5 transition-colors shadow-xs"
            title="Mở Phân hệ Xuất dữ liệu CSV (123 cột QĐ 3176)">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
            </svg>
            <span class="hidden md:inline">Xuất CSV</span>
          </button>

          <div class="hidden sm:block h-6 w-px bg-[#E2E8F0] mx-0.5"></div>

          <!-- User Avatar, Cài đặt cá nhân & Đăng xuất -->
          <div class="flex items-center gap-1.5 sm:gap-2">
            <!-- Nút bấm vào Avatar/Tên mở Cài đặt cá nhân -->
            <button type="button" @click="openUserSettingsModal()"
              class="flex items-center gap-2 p-1 pl-1.5 pr-2 rounded-xl hover:bg-[#F4F6F8] border border-transparent hover:border-[#E2E8F0] transition-colors text-left"
              title="Cài đặt cá nhân & tài khoản (Đổi mật khẩu, Giao diện, Chế độ khám...)">
              <div
                class="w-8 h-8 rounded-full bg-[#3498DB]/15 text-[#3498DB] font-bold text-xs flex items-center justify-center border border-[#3498DB]/30 shadow-2xs">
                <span x-text="(currentUser?.full_name || 'U').charAt(0)"></span>
              </div>
              <div class="text-left hidden sm:block">
                <div class="font-semibold text-[#2C3E50] text-xs truncate max-w-[110px]"
                  x-text="currentUser?.full_name"></div>
                <div class="text-[10px] text-[#7F8C8D] font-mono truncate max-w-[110px]" x-text="currentUser?.role">
                </div>
              </div>
              <svg class="w-3.5 h-3.5 text-[#7F8C8D] hidden sm:inline" fill="none" stroke="currentColor"
                viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
              </svg>
            </button>

            <!-- Nút icon Cài đặt nhanh -->
            <button type="button" @click="openUserSettingsModal()"
              class="p-1.5 text-[#7F8C8D] hover:text-[#3498DB] rounded-lg hover:bg-[#F4F6F8] transition-colors"
              title="Cài đặt cá nhân">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              </svg>
            </button>

            <button type="button" @click="logout()"
              class="p-1.5 text-[#7F8C8D] hover:text-[#E74C3C] rounded-lg hover:bg-[#F4F6F8] transition-colors"
              title="Đăng xuất">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
              </svg>
            </button>
          </div>
        </div>
      </div>
    </header>

    <!-- 2. THANH TAB QUY TRÌNH (VISUAL STEPPER CHIPS) -->
    <nav class="bg-white border-b border-[#E2E8F0] px-4 py-2.5 overflow-x-auto shadow-xs sticky top-16 z-30 no-print">
      <div class="w-full flex items-center gap-2">
        <button type="button" @click="switchExamTab('reception')" :class="activeTab === 'reception' ? 'active' : ''"
          class="yt-chip flex items-center gap-1.5">
          <span>📋 1. Tiếp nhận</span>
          <span x-show="isSectionExamined('reception')" class="text-[10px] px-1.5 rounded-full bg-emerald-100 text-emerald-700 font-bold">✓</span>
        </button>

        <button type="button" @click="switchExamTab('history')" :class="activeTab === 'history' ? 'active' : ''"
          class="yt-chip flex items-center gap-1.5">
          <span>🕒 2. Tiền sử</span>
          <span x-show="isSectionExamined('history')" class="text-[10px] px-1.5 rounded-full bg-emerald-100 text-emerald-700 font-bold">✓</span>
        </button>

        <button type="button" @click="switchExamTab('physical')" :class="activeTab === 'physical' ? 'active' : ''"
          class="yt-chip flex items-center gap-1.5">
          <span>💓 3. Thể lực</span>
          <span x-show="isSectionExamined('physical')" class="text-[10px] px-1.5 rounded-full bg-emerald-100 text-emerald-700 font-bold">✓</span>
        </button>

        <button type="button" @click="switchExamTab('clinical')" :class="activeTab === 'clinical' ? 'active' : ''"
          class="yt-chip flex items-center gap-1.5">
          <span>🩺 4. Lâm sàng</span>
          <span x-show="isSectionExamined('clinical')" class="text-[10px] px-1.5 rounded-full bg-emerald-100 text-emerald-700 font-bold">✓</span>
        </button>

        <button x-show="activeRecordTemplate === 'TREN_18'" type="button" @click="switchExamTab('paraclinical')" :class="activeTab === 'paraclinical' ? 'active' : ''"
          class="yt-chip flex items-center gap-1.5">
          <span>🔬 5. Cận lâm sàng</span>
          <span x-show="isSectionExamined('paraclinical')" class="text-[10px] px-1.5 rounded-full bg-emerald-100 text-emerald-700 font-bold">✓</span>
        </button>

        <button type="button" @click="switchExamTab('conclusion')" :class="activeTab === 'conclusion' ? 'active' : ''"
          class="yt-chip flex items-center gap-1.5">
          <span x-text="activeRecordTemplate === 'TREN_18' ? '✅ 6. Kết luận' : '✅ 5. Kết luận'"></span>
          <span x-show="isSectionExamined('conclusion')" class="text-[10px] px-1.5 rounded-full bg-emerald-100 text-emerald-700 font-bold">✓</span>
          <span x-show="isLocked" class="w-2 h-2 rounded-full bg-[#E74C3C]"></span>
        </button>

        <div class="h-5 w-px bg-slate-200 mx-1"></div>

        <button type="button" @click="openGroupTab()" :class="activeTab === 'group' ? 'active' : ''"
          class="yt-chip text-sky-700">
          <span>🏢 Khám đoàn & HĐ</span>
        </button>

        <button type="button" @click="openExportTab()" :class="activeTab === 'export' ? 'active' : ''"
          class="yt-chip text-[#1E8449]">
          <span>📤 Xuất CSV</span>
        </button>

        <button x-show="isAdmin" type="button" @click="activeTab = 'admin'; loadServerBackups()"
          :class="activeTab === 'admin' ? 'active' : ''" class="yt-chip text-[#8E44AD]">
          <span>⚙ Quản trị</span>
        </button>
      </div>
    </nav>

    <!-- 3. BỐ CỤC CHÍNH 16:9 FULL-WIDTH TRÀN 2 BÊN: COLLAPSIBLE SIDEBAR + WORKSPACE -->
    <div class="flex-1 flex overflow-hidden w-full relative">
      <!-- Backdrop khi mở Sidebar trên Mobile & Tablet (< lg) -->
      <div x-show="sidebarOpen" @click="sidebarOpen = false" x-cloak
        class="fixed inset-0 bg-black/40 z-40 lg:hidden no-print"></div>

      <!-- ============================================================== -->
      <!-- COLLAPSIBLE SIDEBAR / DRAWER TRÊN MOBILE & TABLET               -->
      <!-- ============================================================== -->
      <aside
        class="bg-white border-r border-[#E2E8F0] flex-col shrink-0 lg:h-[calc(100dvh-112px)] lg:sticky lg:top-[112px] transition-all duration-200 ease-in-out no-print"
        :class="sidebarOpen ? 'flex fixed inset-y-0 left-0 w-[85vw] max-w-[320px] z-50 shadow-2xl lg:shadow-none lg:static lg:w-60 xl:w-64' : 'hidden md:flex md:w-[72px] md:h-[calc(100dvh-112px)] md:sticky md:top-[112px] md:z-20'">
        <!-- A. GIAO DIỆN KHI MỞ RỘNG (240PX) -->
        <div x-show="sidebarOpen" class="flex flex-col h-full overflow-hidden">
          <!-- Tiêu đề sidebar & Bộ lọc -->
          <div class="p-3 border-b border-[#E2E8F0] space-y-2.5">
            <div class="flex items-center justify-between">
              <div class="font-bold text-xs uppercase tracking-wider text-[#2C3E50] flex items-center gap-1.5">
                <span class="w-2 h-2 rounded-full bg-[#2ECC71]"></span>
                <span>Danh sách khám</span>
                <span class="text-[11px] font-mono text-[#7F8C8D]" x-text="'(' + recordsList.length + ')'"></span>
              </div>
              <div class="flex items-center gap-2">
                <button type="button" @click="loadRecordsList()" :disabled="recordsLoading"
                  class="text-[#7F8C8D] hover:text-[#2C3E50] text-xs flex items-center gap-1" title="Tải lại danh sách" aria-label="Tải lại danh sách">
                  <svg class="w-3.5 h-3.5" :class="recordsLoading ? 'animate-spin' : ''" fill="none" stroke="currentColor"
                    viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                  </svg>
                </button>
                <button type="button" @click="sidebarOpen = false"
                  class="lg:hidden px-2 py-0.5 text-xs text-slate-600 bg-slate-100 rounded hover:bg-slate-200" aria-label="Đóng danh sách">✕</button>
              </div>
            </div>

            <!-- Ô tìm nhanh trong danh sách & Quét mã tự động -->
            <div class="relative">
              <input type="text" x-model="recordsSearchQ" @input.debounce.300ms="handleRecordsSearchInput($event)"
                @keydown.enter.prevent="handleRecordsSearchInput($event)" placeholder="Lọc tên, CCCD, quét Mã TN..."
                title="Nhập tên/CCCD hoặc quét mã vạch tiếp nhận để tự động nạp hồ sơ"
                class="w-full pl-7 pr-3 py-1 rounded-lg border border-[#E2E8F0] text-xs bg-[#F4F6F8] focus:bg-white focus:outline-none focus:border-[#3498DB]" />
              <svg class="w-3.5 h-3.5 text-[#7F8C8D] absolute left-2 top-2" fill="none" stroke="currentColor"
                viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
              </svg>
            </div>

            <!-- Bộ lọc ngày khám (Từ ngày -> Đến ngày, mặc định ngày hiện tại) -->
            <div class="p-2 bg-slate-50/80 rounded-lg border border-slate-200/80 space-y-1.5 text-[11px]">
              <div class="flex items-center justify-between text-slate-500 font-medium">
                <span class="flex items-center gap-1">
                  <svg class="w-3 h-3 text-sky-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                  </svg>
                  <span>Ngày khám:</span>
                </span>
                <button type="button"
                  @click="recordsDateFrom = todayIso(); recordsDateTo = todayIso(); loadRecordsList()"
                  class="text-[10px] text-sky-600 hover:text-sky-800 font-medium hover:underline">Hôm nay</button>
              </div>
              <div class="grid grid-cols-2 gap-1.5">
                <div>
                  <input type="date" x-model="recordsDateFrom" @change="loadRecordsList()" title="Từ ngày"
                    class="w-full px-1.5 py-0.5 rounded border border-slate-200 text-[10.5px] bg-white text-slate-700 focus:outline-none focus:border-sky-500" />
                </div>
                <div>
                  <input type="date" x-model="recordsDateTo" @change="loadRecordsList()" title="Đến ngày"
                    class="w-full px-1.5 py-0.5 rounded border border-slate-200 text-[10.5px] bg-white text-slate-700 focus:outline-none focus:border-sky-500" />
                </div>
              </div>
            </div>

            <!-- Lọc trạng thái (Tất cả, Đang khám, Đã khóa) -->
            <div class="flex items-center gap-1 text-[11px]">
              <button type="button" @click="recordsFilterStatus = ''; loadRecordsList()"
                :class="recordsFilterStatus === '' ? 'bg-[#2C3E50] text-white font-medium' : 'bg-[#F4F6F8] text-[#7F8C8D] hover:bg-[#E2E8F0]'"
                class="px-2 py-0.5 rounded transition-colors">Tất cả</button>
              <button type="button" @click="recordsFilterStatus = '0'; loadRecordsList()"
                :class="recordsFilterStatus === '0' ? 'bg-[#2ECC71] text-white font-medium' : 'bg-[#F4F6F8] text-[#7F8C8D] hover:bg-[#E2E8F0]'"
                class="px-2 py-0.5 rounded transition-colors">Đang khám</button>
              <button type="button" @click="recordsFilterStatus = '1'; loadRecordsList()"
                :class="recordsFilterStatus === '1' ? 'bg-[#E74C3C] text-white font-medium' : 'bg-[#F4F6F8] text-[#7F8C8D] hover:bg-[#E2E8F0]'"
                class="px-2 py-0.5 rounded transition-colors">Đã khóa</button>
            </div>
          </div>

          <!-- Danh sách cuộn các bệnh nhân -->
          <div class="flex-1 overflow-y-auto divide-y divide-[#E2E8F0]/60">
            <template x-if="recordsLoading">
              <div class="p-4 text-center text-xs text-[#7F8C8D]">Đang tải danh sách...</div>
            </template>

            <template x-if="!recordsLoading && recordsList.length === 0">
              <div class="p-6 text-center text-xs text-[#7F8C8D] space-y-1">
                <div>Chưa có hồ sơ khám nào</div>
                <div class="text-[11px] text-[#7F8C8D]">Hãy tiếp nhận bệnh nhân mới để bắt đầu khám</div>
              </div>
            </template>

            <template x-for="r in recordsList" :key="r.id">
              <div @click="selectRecord(r)"
                class="p-2.5 hover:bg-[#EBF5FB]/60 cursor-pointer transition-colors space-y-1"
                :class="recordId === r.id ? 'bg-[#EBF5FB] border-l-4 border-[#3498DB] pl-2' : ''">
                <div class="flex items-center justify-between">
                  <span class="font-semibold text-[#2C3E50] text-xs uppercase truncate max-w-[140px]"
                    x-text="r.ho_ten || 'Chưa có tên'"></span>
                  <span class="px-1.5 py-0.2 rounded text-[10px] font-semibold tracking-tight"
                    :class="r.status === 1 ? 'bg-[#FDEDEC] text-[#C0392B] border border-[#FADBD8]' : 'bg-[#E8F8F5] text-[#1E8449] border border-[#D4EFDF]'"
                    x-text="r.status === 1 ? 'Đã khóa' : 'Đang khám'"></span>
                </div>

                <div class="flex items-center justify-between text-[11px] text-[#7F8C8D] font-mono">
                  <span x-text="r.ma_tiep_nhan"></span>
                  <span x-text="r.gioi_tinh === '2' ? 'Nữ' : 'Nam'"></span>
                </div>

                <div class="flex items-center justify-between text-[10.5px] text-[#7F8C8D]">
                  <span x-text="r.ngay_sinh ? ('Sinh: ' + r.ngay_sinh) : ''"></span>
                  <span x-text="r.ngay_vao"></span>
                </div>
              </div>
            </template>
          </div>
        </div>

        <!-- B. GIAO DIỆN MINI SIDEBAR (72PX THEO DESIGN.MD 3.2) -->
        <div x-show="!sidebarOpen" class="flex flex-col items-center py-3 space-y-4 h-full">
          <button type="button" @click="sidebarOpen = true"
            class="flex flex-col items-center gap-1 text-[#2C3E50] hover:text-[#3498DB] p-2 rounded-lg hover:bg-[#F4F6F8] transition-colors"
            title="Mở danh sách khám">
            <svg class="w-5 h-5 text-[#3498DB]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
            </svg>
            <span class="text-[10px] font-medium text-center">DS Khám</span>
            <span class="text-[9px] font-bold px-1.5 py-0.2 rounded-full bg-[#EBF5FB] text-[#3498DB]"
              x-text="recordsList.length"></span>
          </button>

          <div class="w-8 h-px bg-[#E2E8F0]"></div>

          <!-- Nút Tạo mới ở mini sidebar -->
          <button type="button" @click="resetForm()"
            class="flex flex-col items-center gap-1 text-[#7F8C8D] hover:text-[#2ECC71] p-2 rounded-lg hover:bg-[#F4F6F8] transition-colors"
            title="Tiếp nhận mới">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
            </svg>
            <span class="text-[10px]">Tạo mới</span>
          </button>

          <!-- Nút Xuất CSV ở mini sidebar -->
          <button type="button" @click="openExportTab()"
            class="flex flex-col items-center gap-1 text-[#7F8C8D] hover:text-[#3498DB] p-2 rounded-lg hover:bg-[#F4F6F8] transition-colors"
            title="Xuất dữ liệu CSV (123 cột)">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
            </svg>
            <span class="text-[10px]">Xuất CSV</span>
          </button>
        </div>
      </aside>

      <!-- KHU VỰC NHẬP LIỆU CHÍNH (MAIN CONTENT AREA TRÀN 2 BÊN) -->
      <main class="flex-1 min-w-0 overflow-y-auto p-3 sm:p-5 pb-32 md:pb-24 space-y-4 h-[calc(100dvh-112px)] w-full">

        <!-- PATIENT HEADER BANNER + CHỌN MẪU + IN PDF A4 -->
        <div x-show="['reception','history','physical','clinical','paraclinical','conclusion'].includes(activeTab)"
             class="bg-white rounded-xl border border-[#E2E8F0] p-3.5 shadow-2xs space-y-2.5 no-print">
          <div class="flex items-center justify-between flex-wrap gap-2">
            <div class="flex items-center gap-2 flex-wrap">
              <span class="font-bold text-sm text-[#2C3E50]" x-text="form.HO_TEN || '(Hồ sơ mới chưa có tên)'"></span>
              <span x-show="form.MA_TIEP_NHAN" class="px-2 py-0.5 rounded-full bg-sky-100 text-sky-800 text-[11px] font-mono font-semibold" x-text="'Số TN: ' + form.MA_TIEP_NHAN"></span>
              <span x-show="recordTemplates.length <= 1" class="px-2 py-0.5 rounded-full bg-slate-100 text-slate-700 text-[11px] font-semibold" x-text="'📄 ' + templateShortLabel(activeRecordTemplate)"></span>
              <span class="px-2 py-0.5 rounded-full text-[11px] font-semibold"
                    :class="recordStatus >= 2 ? 'bg-red-100 text-red-700' : (recordStatus === 1 ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-800')"
                    x-text="recordStatus >= 2 ? '🔒 Đã ký khóa' : (recordStatus === 1 ? '✓ Hoàn tất' : '⏳ Đang khám')"></span>
            </div>

            <div class="flex items-center gap-2 flex-wrap">
              <button x-show="recordId" type="button" @click="printRecordPdf(true)"
                      class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-800 border border-slate-300 rounded-lg text-xs font-semibold flex items-center gap-1">
                <span>🖨 In Tiếp Nhận</span>
              </button>
              <button x-show="recordId && canPrintFullKsk()" type="button" @click="printRecordPdf(false)"
                      class="px-3 py-1.5 bg-[#0F766E] hover:bg-[#115E59] text-white rounded-lg text-xs font-semibold flex items-center gap-1 shadow-xs">
                <span>📄 In Giấy KSK</span>
              </button>
            </div>
          </div>

          <!-- Chọn nhiều mẫu cho hồ sơ (ở tab Tiếp nhận) hoặc chuyển đổi mẫu khi hồ sơ có > 1 mẫu -->
          <div x-show="activeTab === 'reception' || recordTemplates.length > 1" class="pt-2 border-t border-slate-100 flex items-center justify-between flex-wrap gap-2 text-xs">
            <div x-show="activeTab === 'reception'" class="flex items-center gap-1.5 flex-wrap">
              <span class="text-[11px] font-semibold text-slate-500 mr-1">Mẫu phiếu áp dụng:</span>
              <template x-for="t in allTemplatesMeta" :key="t.code">
                <button type="button" @click="toggleRecordTemplate(t.code)"
                        class="px-2.5 py-1 rounded-md border text-[11px] font-medium transition-colors"
                        :class="recordTemplates.includes(t.code) ? 'bg-teal-50 border-teal-600 text-teal-800 font-semibold' : 'bg-white border-slate-200 text-slate-600'">
                  <span x-text="(recordTemplates.includes(t.code) ? '☑ ' : '☐ ') + t.short_label"></span>
                </button>
              </template>
            </div>
            <div x-show="recordTemplates.length > 1" class="flex items-center gap-1.5 flex-wrap">
              <span class="text-[11px] font-semibold text-slate-500">Mẫu đang nhập:</span>
              <template x-for="code in recordTemplates" :key="code">
                <button type="button" @click="activeRecordTemplate = code"
                        class="px-2.5 py-0.5 rounded-full text-[11px] font-semibold border transition-colors"
                        :class="activeRecordTemplate === code ? 'bg-[#0F766E] border-[#0F766E] text-white' : 'bg-slate-50 border-slate-200 text-slate-700'"
                        x-text="templateShortLabel(code)"></button>
              </template>
            </div>
          </div>
        </div>
